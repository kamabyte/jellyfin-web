# Проверки на каждый push в main и pull request: Pint, PHPStan, тесты Pest,
# линтер и форматирование фронтенда, типы TypeScript, сборка.
name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
